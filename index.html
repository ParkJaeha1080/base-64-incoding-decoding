<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인코더 & 디코더</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    color-scheme: light;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #17181a;
    --muted: #6f7379;
    --border: #e1e3e6;
    --button: #f0f1f3;
    --button-hover: #e7e9ec;
    --primary: #17181a;
    --primary-text: #ffffff;
}

body.dark {
    color-scheme: dark;
    --bg: #111214;
    --card: #191a1d;
    --text: #f1f2f3;
    --muted: #9a9da3;
    --border: #2b2d31;
    --button: #24262a;
    --button-hover: #303238;
    --primary: #f1f2f3;
    --primary-text: #111214;
}

body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
    transition: background 0.2s, color 0.2s;
}

.container {
    width: 100%;
    max-width: 620px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}

h1 {
    font-size: 21px;
    font-weight: 650;
    margin: 0;
}

.theme-btn {
    width: auto;
    min-width: 72px;
    padding: 8px 12px;
    font-size: 13px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
}

.tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
}

.tab {
    width: auto;
    padding: 9px 13px;
    margin: 0;
    border-radius: 7px 7px 0 0;
    background: transparent;
    color: var(--muted);
    border-bottom: 2px solid transparent;
}

.tab:hover {
    background: var(--button);
}

.tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
}

.panel {
    display: none;
}

.panel.active {
    display: block;
}

label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 7px;
}

textarea {
    width: 100%;
    height: 130px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    resize: vertical;
    outline: none;
    font-size: 14px;
    line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

textarea:focus {
    border-color: #888c92;
}

textarea::placeholder {
    color: var(--muted);
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--button);
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: var(--button-hover);
}

.buttons button:first-child {
    background: var(--primary);
    color: var(--primary-text);
    border-color: var(--primary);
}

.copy-btn {
    margin-top: 8px;
}

.result {
    margin-top: 18px;
}

.result textarea {
    min-height: 130px;
}

.flash {
    animation: flashAnim 0.25s;
}

@keyframes flashAnim {
    0% { border-color: #777; }
    100% { border-color: var(--border); }
}

@media (max-width: 520px) {
    body {
        padding: 12px;
        align-items: flex-start;
    }

    .card {
        padding: 16px;
    }

    .header {
        margin-top: 8px;
    }
}
</style>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>인코더 & 디코더</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeButton">다크</button>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('base64', this)">Base64</button>
            <button class="tab" onclick="switchTab('hex', this)">ASCII ↔ HEX</button>
        </div>

        <div id="base64" class="panel active">
            <label for="input">텍스트</label>
            <textarea id="input" placeholder="텍스트 또는 Base64 값을 입력하세요"></textarea>

            <div class="buttons">
                <button onclick="encodeText()">인코딩</button>
                <button onclick="decodeText()">디코딩</button>
            </div>

            <button class="copy-btn" onclick="copyResult('output')">결과 복사</button>

            <div class="result">
                <label for="output">결과</label>
                <textarea id="output" readonly></textarea>
            </div>
        </div>

        <div id="hex" class="panel">
            <label for="hexInput">ASCII / HEX</label>
            <textarea id="hexInput" placeholder="ASCII 텍스트 또는 HEX 값 입력"></textarea>

            <div class="buttons">
                <button onclick="asciiToHex()">ASCII → HEX</button>
                <button onclick="hexToAscii()">HEX → ASCII</button>
            </div>

            <button class="copy-btn" onclick="copyResult('hexOutput')">결과 복사</button>

            <div class="result">
                <label for="hexOutput">결과</label>
                <textarea id="hexOutput" readonly></textarea>
            </div>
        </div>
    </div>
</div>

<script>
function switchTab(tabId, button) {
    document.querySelectorAll(".panel").forEach(panel => panel.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));

    document.getElementById(tabId).classList.add("active");
    button.classList.add("active");
}

function encodeText() {
    const text = document.getElementById("input").value.trim();
    if (!text) return alert("텍스트를 입력하세요.");

    const bytes = new TextEncoder().encode(text);
    let binary = "";
    bytes.forEach(byte => binary += String.fromCharCode(byte));
    setOutput("output", btoa(binary));
}

function decodeText() {
    const text = document.getElementById("input").value.trim().replace(/\s/g, "");
    if (!text) return alert("Base64 값을 입력하세요.");

    try {
        const binary = atob(text);
        const bytes = new Uint8Array([...binary].map(char => char.charCodeAt(0)));
        setOutput("output", new TextDecoder().decode(bytes));
    } catch {
        setOutput("output", "오류: 올바른 Base64 값이 아닙니다.");
    }
}

function asciiToHex() {
    const text = document.getElementById("hexInput").value;
    if (!text) return alert("ASCII 텍스트를 입력하세요.");

    const bytes = new TextEncoder().encode(text);
    const hex = [...bytes]
        .map(byte => byte.toString(16).padStart(2, "0").toUpperCase())
        .join(" ");

    setOutput("hexOutput", hex);
}

function hexToAscii() {
    const hex = document.getElementById("hexInput").value
        .trim()
        .replace(/0x/gi, "")
        .replace(/\s+/g, "");

    if (!hex) return alert("HEX 값을 입력하세요.");

    if (!/^[0-9a-fA-F]+$/.test(hex) || hex.length % 2 !== 0) {
        setOutput("hexOutput", "오류: 올바른 HEX 값이 아닙니다.");
        return;
    }

    try {
        const bytes = new Uint8Array(
            hex.match(/.{2}/g).map(byte => parseInt(byte, 16))
        );
        setOutput("hexOutput", new TextDecoder().decode(bytes));
    } catch {
        setOutput("hexOutput", "오류");
    }
}

function setOutput(id, text) {
    const out = document.getElementById(id);
    out.value = text;
    out.classList.add("flash");
    setTimeout(() => out.classList.remove("flash"), 250);
}

function copyResult(id) {
    const value = document.getElementById(id).value;

    if (!value) {
        return alert("복사할 결과가 없습니다.");
    }

    navigator.clipboard.writeText(value)
        .then(() => alert("복사했습니다."));
}

function toggleTheme() {
    document.body.classList.toggle("dark");

    const isDark = document.body.classList.contains("dark");
    document.getElementById("themeButton").textContent = isDark ? "라이트" : "다크";
    localStorage.setItem("theme", isDark ? "dark" : "light");
}

if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
    document.getElementById("themeButton").textContent = "라이트";
}
</script>
</body>
</html>
