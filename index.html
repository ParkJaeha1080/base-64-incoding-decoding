<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 인코더 & 디코더</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #74ebd5, #acb6e5);
    font-family: Arial, sans-serif;
    padding: 10px;
}

.glass {
    width: 100%;
    max-width: 520px;
    padding: 25px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.3);
}

h2 {
    text-align: center;
}

.tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 18px;
}

.tab {
    background: rgba(255,255,255,0.3);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    padding: 11px;
    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    background: rgba(255,255,255,0.65);
}

.panel {
    display: none;
}

.panel.active {
    display: block;
}

textarea {
    width: 100%;
    height: 110px;
    border-radius: 10px;
    border: none;
    padding: 10px;
    margin-top: 5px;
    resize: none;
    outline: none;
    font-size: 14px;
    font-family: monospace;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.35);
    cursor: pointer;
    font-weight: bold;
}

.copy-btn {
    margin-top: 10px;
}

.result {
    margin-top: 10px;
}

.flash {
    animation: flashAnim 0.3s;
}

@keyframes flashAnim {
    0% { background: #a8ffb0; }
    100% { background: white; }
}
</style>
</head>

<body>

<div class="glass">
    <h2>🔐 인코더 & 디코더</h2>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('base64', this)">🔐 Base64</button>
        <button class="tab" onclick="switchTab('hex', this)">🔢 ASCII ↔ HEX</button>
    </div>

    <div id="base64" class="panel active">
        <label>텍스트 입력</label>
        <textarea id="input"></textarea>

        <div class="buttons">
            <button onclick="encodeText()">🔐 인코딩</button>
            <button onclick="decodeText()">🔓 디코딩</button>
        </div>

        <button class="copy-btn" onclick="copyResult('output')">📋 결과 복사</button>

        <div class="result">
            <label>결과</label>
            <textarea id="output" readonly></textarea>
        </div>
    </div>

    <div id="hex" class="panel">
        <label>ASCII / HEX 입력</label>
        <textarea id="hexInput" placeholder="ASCII 텍스트 또는 HEX 입력 (예: 48 65 6C 6C 6F)"></textarea>

        <div class="buttons">
            <button onclick="asciiToHex()">🔤 ASCII → HEX</button>
            <button onclick="hexToAscii()">🔢 HEX → ASCII</button>
        </div>

        <button class="copy-btn" onclick="copyResult('hexOutput')">📋 결과 복사</button>

        <div class="result">
            <label>결과</label>
            <textarea id="hexOutput" readonly></textarea>
        </div>
    </div>
</div>

<script>
function switchTab(tabId, button) {
    document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));

    document.getElementById(tabId).classList.add('active');
    button.classList.add('active');
}

function encodeText() {
    const text = document.getElementById("input").value.trim();
    if (!text) return alert("텍스트 입력");

    const bytes = new TextEncoder().encode(text);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    setOutput("output", btoa(binary));
}

function decodeText() {
    let text = document.getElementById("input").value.trim().replace(/\s/g,'');
    if (!text) return alert("Base64 입력");

    try {
        const binary = atob(text);
        const bytes = new Uint8Array([...binary].map(c => c.charCodeAt(0)));
        setOutput("output", new TextDecoder().decode(bytes));
    } catch {
        setOutput("output", "❌ 오류");
    }
}

function asciiToHex() {
    const text = document.getElementById("hexInput").value;
    if (!text) return alert("ASCII 입력");

    const bytes = new TextEncoder().encode(text);
    const hex = [...bytes]
        .map(byte => byte.toString(16).padStart(2, "0").toUpperCase())
        .join(" ");

    setOutput("hexOutput", hex);
}

function hexToAscii() {
    const hex = document.getElementById("hexInput").value
        .trim()
        .replace(/0x/gi, "")
        .replace(/\s+/g, "");

    if (!hex) return alert("HEX 입력");
    if (!/^[0-9a-fA-F]+$/.test(hex) || hex.length % 2 !== 0) {
        setOutput("hexOutput", "❌ 올바른 HEX 형식이 아닙니다.");
        return;
    }

    try {
        const bytes = new Uint8Array(
            hex.match(/.{2}/g).map(byte => parseInt(byte, 16))
        );
        setOutput("hexOutput", new TextDecoder().decode(bytes));
    } catch {
        setOutput("hexOutput", "❌ 오류");
    }
}

function setOutput(id, text) {
    const out = document.getElementById(id);
    out.value = text;
    out.classList.add("flash");
    setTimeout(() => out.classList.remove("flash"), 300);
}

function copyResult(id) {
    const out = document.getElementById(id);
    navigator.clipboard.writeText(out.value).then(() => {
        alert("✅ 복사 완료");
    });
}
</script>

</body>
</html>
